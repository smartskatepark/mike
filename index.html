<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureSurface Technologies | Active Impact Matrix</title>
    <style>
        :root {
            --bg-dark: #030712;
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #06b6d4;
            --accent-secondary: #3b82f6;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(6, 182, 212, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            padding-top: 120px;
        }

        /* HEADER NAVIGATION CONTAINER */
        .nav-wrapper {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            border-bottom: 1px solid var(--border); 
            background: rgba(3, 7, 18, 0.9); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            z-index: 1000;
        }
        
        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1.5rem 2rem; 
            max-width: 1200px; 
            margin: 0 auto; 
            width: 100%; 
        }
        
        .logo { 
            font-weight: 800; 
            font-size: 1.25rem; 
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-decoration: none; 
        }
        
        .nav-links { 
            display: flex; 
            gap: 2rem; 
            list-style: none; 
        }
        
        .nav-links a { 
            color: var(--text-secondary); 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 500; 
            transition: color 0.2s ease; 
        }
        
        .nav-links a:hover { 
            color: var(--accent-primary); 
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem 2rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(3, 7, 12, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1.25rem;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: var(--accent-primary);
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            width: max-content;
            max-width: 100%;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 800px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.7;
        }

        /* Call To Action Buttons */
        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: #000;
            font-weight: 700;
        }

        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); border-color: #ffffff; }

        /* MULTIMEDIA TECH SHOWCASE CONTAINER LAYER */
        .showcase-banner-box {
            width: 100%;
            max-width: 1000px;
            height: 380px; 
            margin: 4rem auto;
            border-radius: 16px;
            border: 1px solid rgba(6, 182, 212, 0.3); 
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
            overflow: hidden; 
        }

        .showcase-banner-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center; 
        }

        /* B2B SECTOR CONTAINER AREA */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem 2rem;
        }

        .section-header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .section-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }

        /* 3-COLUMN ORIGINAL GRID LAYOUT */
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-top: 2rem;
        }

        .sector-card {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            text-align: left;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 280px;
        }

        .sector-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(6, 182, 212, 0.15);
        }

        .sector-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sector-card p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .sector-link {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: auto;
        }

        footer {
            max-width: 1200px;
            margin: 4rem auto 0 auto;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* ISOLATED MOBILE RULES */
        @media (max-width: 968px) {
            body {
                padding-top: 0px !important; 
            }
            .nav-wrapper {
                position: relative; 
            }
            .navbar { 
                flex-direction: column !important; 
                gap: 1.25rem !important; 
                text-align: center !important; 
                padding: 1.5rem 1rem !important;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1.5rem;
            }
            .hero {
                padding: 2rem 1rem 1rem 1rem;
            }
            .hero h1 { 
                font-size: 2rem !important; 
                line-height: 1.3 !important;
                letter-spacing: -0.02em !important;
            }
            .hero p {
                font-size: 1rem !important;
                line-height: 1.6 !important;
            }
            .badge { 
                font-size: 0.7rem !important; 
                padding: 0.4rem 1rem !important;
                display: inline-block !important;
                width: auto !important;
                max-width: 100% !important;
                white-space: normal !important; 
                margin: 0 auto 1.5rem auto !important;
            }
            .showcase-banner-box {
                height: 180px !important; 
                margin: 2rem auto !important;
                border-radius: 12px;
            }
            .sector-grid { 
                grid-template-columns: 1fr !important; 
                gap: 1.5rem !important;
            }
            .sector-card {
                min-height: auto !important;
                padding: 2rem 1.5rem !important;
            }
            .cta-group { 
                flex-direction: column; 
                width: 100%;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
