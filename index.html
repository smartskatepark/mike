<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureSurface Technologies | Smart Surface Systems</title>
    <style>
        :root {
            --bg-dark: #030712;
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #06b6d4;
            --accent-secondary: #3b82f6;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(6, 182, 212, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navbar Component */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(3, 7, 18, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.2);
            color: var(--accent-primary);
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 640px;
            margin: 0 auto 2.5rem auto;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: #000;
            font-weight: 700;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-secondary);
        }

        /* Main Container */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .grid-section {
            margin-bottom: 6rem;
        }

        .section-header {
            margin-bottom: 3rem;
            text-align: left;
        }

        .section-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Applications Grid Section */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .app-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-card:hover {
            border-color: var(--accent-secondary);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(59, 130, 246, 0.15);
        }

        .app-card h3 {
            font-size: 1.35rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .app-card .benefits {
            list-style: none;
            margin-top: 1rem;
        }

        .app-card .benefits li {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .app-card .benefits li::before {
            content: "✓";
            color: var(--accent-primary);
            font-weight: bold;
        }

        /* Core Technology Cards Setup */
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        .tech-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .tech-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(6, 182, 212, 0.15);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .tech-card h3 {
            font-size: 1.35rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .tech-card p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .tech-card .feature-tag {
            color: var(--accent-primary);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            margin-bottom: 0.25rem;
        }

        /* Deployment/Framework Layout */
        .deployment-section {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(3, 7, 12, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
        }

        .deployment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .step-card {
            padding: 1.5rem;
            border-left: 2px solid var(--border);
            transition: border-color 0.3s ease;
        }

        .step-card:hover {
            border-left-color: var(--accent-secondary);
        }

        .step-num {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-secondary);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
        }

        .step-card h4 {
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .step-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Footer Component */
        footer {
            max-width: 1200px;
            margin: 6rem auto 0 auto;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .navbar, footer {
                flex-direction: column;
                gap: 1.5rem;
                text-align: center;
            }
            .hero h1 {
                font-size: 2.5rem;
            }
            .cta-group {
                flex-direction: column;
            }
            .deployment-section {
                padding: 1.5rem;
            }
        }
    </style>
