<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureSurface Technologies | Contact</title>
    <style>
        :root {
            --bg-dark: #030712;
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #06b6d4;
            --accent-secondary: #3b82f6;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(6, 182, 212, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-primary); 
            line-height: 1.6; 
        }
        
        /* HEADER NAVIGATION STYLING - ALIGNED WITH DESIGNS FLOW */
        .nav-wrapper { 
            border-bottom: 1px solid var(--border); 
            background: rgba(3, 7, 18, 0.9); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px); 
            width: 100%;
        }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .logo { font-weight: 800; font-size: 1.25rem; background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-primary); }
        .btn-nav { display: inline-block; padding: 0.5rem 1rem; font-weight: 600; border-radius: 8px; text-decoration: none; font-size: 0.85rem; background: transparent; color: var(--text-primary); border: 1px solid var(--border); }

        .form-container { max-width: 650px; margin: 0 auto; padding: 4rem 2rem; text-align: center; }
        
        /* GLOWING BADGE MATCHING USER SCREENSHOT STYLE */
        .badge { display: inline-block; padding: 0.35rem 1.25rem; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.25); color: var(--accent-primary); border-radius: 9999px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 2.5rem; letter-spacing: 0.05em; white-space: nowrap; box-shadow: 0 0 15px rgba(6, 182, 212, 0.1); width: max-content; max-width: 100%; }
        
        .contact-form { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; padding: 3rem; text-align: left; transition: border-color 0.3s ease; }
        .contact-form:focus-within { border-color: rgba(6, 182, 212, 0.3); box-shadow: 0 0 30px rgba(6, 182, 212, 0.05); }
        
        .form-group { margin-bottom: 1.75rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.03em; }
        
        .form-control { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; color: var(--text-primary); font-family: inherit; font-size: 0.95rem; transition: all 0.2s ease; }
        .form-control:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 10px rgba(6, 182, 212, 0.1); }
        
        textarea.form-control { resize: vertical; min-height: 120px; }
        
        .btn-submit { width: 100%; background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary)); color: #000; border: none; padding: 0.9rem; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: opacity 0.2s ease, transform 0.2s ease; margin-top: 0.5rem; }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }

        footer { max-width: 1200px; margin: 4rem auto 0 auto; padding: 3rem 2rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; color: var(--text-secondary); font-size: 0.875rem; }
        
        /* RESPONSIVE LAYOUTS */
        @media (max-width: 968px) { 
            .navbar { 
                flex-direction: column !important; 
                gap: 1.25rem !important; 
                text-align: center !important; 
                padding: 1.5rem 1rem !important;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1.5rem;
            }
            .form-container {
                padding: 2.5rem 1rem !important;
            }
            .badge { 
                font-size: 0.7rem !important; 
                padding: 0.4rem 1rem !important;
                display: inline-block !important;
                width: auto !important;
                max-width: 100% !important;
                white-space: normal !important; 
                margin: 0 auto 1.5rem auto !important;
            }
            .contact-form { padding: 2rem 1.5rem !important; }
            footer { flex-direction: column; gap: 1.5rem; text-align: center; } 
        }
    </style>
</head>
<body>

    <div class="nav-wrapper">
        <nav class="navbar">
            <a href="index.html" class="logo">FutureSurface</a>
            <ul class="nav-links">
                <li><a href="designs.html">Designs</a></li>
                <li><a href="applications.html">Applications</a></li>
                <li><a href="#" class="active">Contact</a></li>
            </ul>
            <a href="request.html" class="btn-nav">Request Portfolio</a>
        </nav>
    </div>
    <main class="form-container">
        <span class="badge">General Inquiries</span>
        
        <form class="contact-form" action="https://web3forms.com" method="POST">
            <!-- EMBEDDED SYSTEM SUBMISSION KEY ACCESS TOKEN TOKEN -->
            <input type="hidden" name="access_key" value="bdb81f63-8133-4a40-95f2-f4ad22f63247">
            
            <!-- Redirects back to your live contact page on successful submission -->
            <input type="hidden" name="redirect" value="https://github.io">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="organization">Organization</label>
                <input type="text" id="organization" name="organization" class="form-control" placeholder="Company or Agency Name">
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" class="form-control" required placeholder="How can our engineering teams assist with your infrastructure requirements?"></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Submit Inquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 FutureSurface Technologies. All Rights Reserved.</p>
    </footer>

</body>
</html>
