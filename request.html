<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureSurface | Request Portfolio</title>
    <style>
        :root {
            --bg-dark: #030712;
            --bg-surface: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #06b6d4;
            --accent-secondary: #3b82f6;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg-dark); color: var(--text-primary); padding-top: 120px; min-height: 100vh; }
        
        /* MATCHING CENTERED HEADER CONTAINER ARRAY */
        .nav-wrapper { position: fixed; top: 0; left: 0; width: 100%; border-bottom: 1px solid var(--border); background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 1000; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .logo { font-weight: 800; font-size: 1.25rem; background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover { color: var(--accent-primary); }
        .btn-nav { display: inline-block; padding: 0.5rem 1rem; font-weight: 600; border-radius: 8px; text-decoration: none; font-size: 0.85rem; background: transparent; color: var(--text-primary); border: 1px solid var(--border); }

        .form-container { max-width: 500px; margin: 4rem auto; padding: 2.5rem; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; color: var(--accent-primary); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
        input, textarea { width: 100%; padding: 0.85rem 1rem; background: #030712; border: 1px solid var(--border); border-radius: 8px; color: #ffffff; font-size: 0.95rem; }
        input:focus, textarea:focus { border-color: var(--accent-primary); outline: none; }
        .btn-submit { width: 100%; padding: 1.1rem; background: linear-gradient(to right, #06b6d4, #3b82f6); color: #000; border: none; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 8px; cursor: pointer; }
        footer { text-align: center; padding: 4rem 2rem; color: var(--text-secondary); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: 6rem; }
    </style>
</head>
<body>

    <!-- Repaired Center-Aligned Navigation Header Bar -->
    <div class="nav-wrapper">
        <nav class="navbar">
            <a href="index.html" class="logo">FutureSurface</a>
            <ul class="nav-links">
                <li><a href="designs.html">Designs</a></li>
                <li><a href="index.html#applications">Applications</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="#" class="btn-nav" style="border-color: var(--accent-primary); color: var(--text-primary);">Request Portfolio</a>
        </nav>
    </div>

    <!-- Simplified Data Input Panel Card -->
    <div class="form-container">
        <form action="https://formspree.io" method="POST">
            <input type="hidden" name="_subject" value="URGENT: Portfolio Access Request">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Name">
            </div>
            
            <div class="form-group">
                <label>Company / Organization</label>
                <input type="text" name="organization" required placeholder="Company Node">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="_replyto" required placeholder="name@company.com">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="(555) 555-5555">
            </div>
            
            <div class="form-group">
                <label>Reason for Interest</label>
                <textarea name="interest_reason" rows="4" required placeholder="Outline field of use interest..."></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Submit Portfolio Request</button>
        </form>
    </div>

    <footer>&copy; 2026 FutureSurface Technologies. All Rights Reserved. Private Archive. [PTO/SB/16]</footer>

</body>
</html>
